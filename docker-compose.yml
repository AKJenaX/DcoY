services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcoy_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - JWT_SECRET=prod_secret_key_super_secure_32_chars_long_minimum
      - LLM_ENABLED=false
      - LOG_FORMAT_JSON=true
    restart: unless-stopped
    volumes:
      - dcoy_db_volume:/app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  dcoy_db_volume:
    driver: local
