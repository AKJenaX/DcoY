<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Direction Preview // Operator Security Portal</title>
  
  <!-- Modern cyber/tech fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Core layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030305;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e2e8f0;
    }

    /* Outer Container with radial dark ambient light */
    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 25% 50%, #0c0d14 0%, #030305 70%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8%;
    }

    /* Ambient background grid */
    .viewport-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
    }

    /* SVG Canvas styling */
    #svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Glassmorphic Security Portal Card */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 480px;
      height: 620px;
      background: rgba(8, 8, 12, 0.45);
      border-radius: 20px;
      border: 1px solid rgba(255, 191, 0, 0.25);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.7),
        inset 0 1px 0px rgba(255, 255, 255, 0.08),
        0 0 40px rgba(255, 191, 0, 0.03);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Cybernetic decoration corner brackets */
    .glass-card::before, .glass-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: rgba(255, 191, 0, 0.6);
      border-style: solid;
      pointer-events: none;
    }
    
    .glass-card::before {
      top: 15px;
      left: 15px;
      border-width: 2px 0 0 2px;
    }

    .glass-card::after {
      bottom: 15px;
      right: 15px;
      border-width: 0 2px 2px 0;
    }

    /* Header styling */
    .card-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 20px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #ffb300;
      margin-bottom: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      line-height: 1.1;
    }

    .card-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 6px;
    }

    /* Form Fields */
    .card-body {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      margin: 30px 0;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.5);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      border-color: rgba(255, 191, 0, 0.5);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 15px rgba(255, 191, 0, 0.1);
    }

    .input-icon {
      position: absolute;
      right: 16px;
      color: rgba(255, 191, 0, 0.4);
      font-size: 12px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* Stats subpanel */
    .stats-panel {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-name {
      font-size: 10px;
      font-family: 'Rajdhani', sans-serif;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stat-val {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .stat-val.highlight {
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }

    /* Button */
    .portal-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(255, 191, 0, 0.15) 0%, rgba(255, 191, 0, 0.03) 100%);
      border: 1px solid rgba(255, 191, 0, 0.5);
      border-radius: 8px;
      padding: 16px;
      color: #ffb300;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px rgba(255, 191, 0, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .portal-btn:hover {
      background: linear-gradient(135deg, rgba(255, 191, 0, 0.35) 0%, rgba(255, 191, 0, 0.1) 100%);
      box-shadow: 0 0 25px rgba(255, 191, 0, 0.25);
      color: #ffffff;
      border-color: #ffb300;
    }

    /* Footer styling */
    .card-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.3);
    }

    .footer-warning {
      color: rgba(255, 191, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    
    <!-- SVG Background Canvas containing hexagons and glowing ribbons -->
    <svg id="svg-canvas" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Glow filters -->
        <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur1" />
          <feGaussianBlur stdDeviation="22" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur1" />
          <feGaussianBlur stdDeviation="22" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur1" />
          <feGaussianBlur stdDeviation="22" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="mask-blur">
          <feGaussianBlur stdDeviation="12" />
        </filter>

        <!-- Intersection Mask to capture overlaps -->
        <mask id="cyan-mask">
          <rect x="-100" y="-100" width="2120" height="1280" fill="black" />
          <!-- Glow region of Cyan ribbon in mask (semi-transparent white) -->
          <path id="mask-glow-path" fill="none" stroke="white" stroke-width="36" filter="url(#mask-blur)" opacity="0.8" />
          <!-- Core region of Cyan ribbon in mask (opaque white) -->
          <path id="mask-core-path" fill="none" stroke="white" stroke-width="10" />
        </mask>

        <!-- 3D Hexagon Face Gradients -->
        <linearGradient id="top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e1e24" />
          <stop offset="100%" stop-color="#0f0f12" />
        </linearGradient>

        <linearGradient id="side-left-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#15151b" />
          <stop offset="100%" stop-color="#08080a" />
        </linearGradient>

        <linearGradient id="side-right-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0f0f13" />
          <stop offset="100%" stop-color="#040405" />
        </linearGradient>
      </defs>

      <!-- Hexagon Field Group -->
      <g id="hex-field"></g>

      <!-- Glowing Ribbons Group -->
      <g id="energy-ribbons">
        <!-- Amber Ribbon (Glow + Core) -->
        <path id="amber-glow" fill="none" stroke="#ffb300" stroke-width="16" filter="url(#glow-amber)" opacity="0.3" />
        <path id="amber-core" fill="none" stroke="#ffd54f" stroke-width="4.5" />

        <!-- Cyan Ribbon (Glow + Core) -->
        <path id="cyan-glow" fill="none" stroke="#00e5ff" stroke-width="16" filter="url(#glow-cyan)" opacity="0.3" />
        <path id="cyan-core" fill="none" stroke="#80deea" stroke-width="4.5" />

        <!-- Violet Overlap Region (Only visible where Amber intersects Cyan mask) -->
        <path id="violet-glow" fill="none" stroke="#d500f9" stroke-width="18" filter="url(#glow-violet)" opacity="0.6" mask="url(#cyan-mask)" />
        <path id="violet-core" fill="none" stroke="#f48fb1" stroke-width="4.5" mask="url(#cyan-mask)" />
      </g>
    </svg>

    <!-- Glassmorphic Card Overlay -->
    <div class="glass-card">
      <div class="card-header">
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span>SYS.STATUS: SECURE</span>
        </div>
        <h1 class="card-title">OPERATOR SECURITY PORTAL</h1>
        <div class="card-subtitle">DECOY DEPLOYMENT VECTOR // AXIS-01</div>
      </div>

      <div class="card-body">
        <div class="input-group">
          <label class="input-label" for="op-id">OPERATOR IDENTITY</label>
          <div class="input-wrapper">
            <input type="text" id="op-id" value="OP_KUMAR_A9" readonly>
            <span class="input-icon">SECURE</span>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="passkey">AUTHENTICATION VECTOR</label>
          <div class="input-wrapper">
            <input type="password" id="passkey" value="••••••••••••••••" readonly>
            <span class="input-icon">KEYCARD</span>
          </div>
        </div>

        <div class="stats-panel">
          <div class="stat-item">
            <span class="stat-name">Integrity</span>
            <span class="stat-val">99.98%</span>
          </div>
          <div class="stat-item">
            <span class="stat-name">Sync Rate</span>
            <span class="stat-val highlight">1.82 Gb/s</span>
          </div>
        </div>
      </div>

      <div class="card-action">
        <button class="portal-btn" onclick="alert('Access Protocol Active // Initializing uplink sequence...')">INITIALIZE UPLINK</button>
      </div>

      <div class="card-footer">
        <span>SECURITY AUTH: LVL 4</span>
        <span class="footer-warning">RESTRICTED TERMINAL</span>
      </div>
    </div>

  </div>

  <script>
    // Configuration
    const width = 1920;
    const height = 1080;

    // --- 1. Hexagon Generation ---
    const hexGroup = document.getElementById('hex-field');
    const r = 38; // base hexagon radius
    const f = 0.58; // vertical tilt/flattening factor (gives perspective)
    const hMin = 10; // minimum extrusion height
    const hMax = 28; // maximum extrusion height

    const colWidth = Math.sqrt(3) * r;
    const rowHeight = 1.5 * r * f;

    const cols = Math.ceil(width / colWidth) + 2;
    const rows = Math.ceil(height / rowHeight) + 2;

    const hexagons = [];

    // Grid placement with density gradient
    for (let row = -2; row < rows; row++) {
      for (let col = -2; col < cols; col++) {
        let x = col * colWidth;
        if (row % 2 !== 0) {
          x += colWidth / 2;
        }
        let y = row * rowHeight;

        // Minor position jitter to break rigid grid feel
        x += (Math.random() - 0.5) * 5;
        y += (Math.random() - 0.5) * 5;

        // Normalized X coordinate (0 to 1) for density mapping
        const tx = x / width;

        // Probability function: dense on left third, thinning out toward right
        let prob = 0;
        if (tx < 0.25) {
          prob = 0.88; // Dense cluster
        } else if (tx < 0.6) {
          // Drop linearly from 88% to 15%
          prob = 0.88 - ((tx - 0.25) / 0.35) * 0.73;
        } else if (tx < 0.85) {
          // Drop linearly from 15% to 2%
          prob = 0.15 - ((tx - 0.6) / 0.25) * 0.13;
        } else {
          prob = 0.02; // Very sparse
        }

        if (Math.random() > prob) continue;

        // Taller columns on the left to add landscape depth
        const heightFactor = 1 - tx;
        const h = hMin + Math.random() * (hMax - hMin) * (0.3 + 0.7 * heightFactor);

        hexagons.push({ x, y, r, h, f });
      }
    }

    // Sort hexagons by Y coordinate (back-to-front Painter's Algorithm)
    // This ensures proper overlapping when drawing extruded 3D columns
    hexagons.sort((a, b) => a.y - b.y);

    // Build the SVG paths for 3D hexagons
    let hexContent = '';
    hexagons.forEach(hex => {
      const { x, y, r, h, f } = hex;
      const dx = r * Math.sqrt(3) / 2;
      const dy = r * f / 2;
      const ry = r * f;

      // Top face vertices
      const p0 = { x: x, y: y - ry };
      const p1 = { x: x + dx, y: y - dy };
      const p2 = { x: x + dx, y: y + dy };
      const p3 = { x: x, y: y + ry };
      const p4 = { x: x - dx, y: y + dy };
      const p5 = { x: x - dx, y: y - dy };

      // Extruded side vertices (only 2 side panels are visible on a vertically extruded pointy hex)
      const p2_b = { x: p2.x, y: p2.y + h };
      const p3_b = { x: p3.x, y: p3.y + h };
      const p4_b = { x: p4.x, y: p4.y + h };

      // SVG path segments
      const topPath = `M ${p5.x},${p5.y} L ${p0.x},${p0.y} L ${p1.x},${p1.y} L ${p2.x},${p2.y} L ${p3.x},${p3.y} L ${p4.x},${p4.y} Z`;
      const sideLeftPath = `M ${p4.x},${p4.y} L ${p3.x},${p3.y} L ${p3_b.x},${p3_b.y} L ${p4_b.x},${p4_b.y} Z`;
      const sideRightPath = `M ${p3.x},${p3.y} L ${p2.x},${p2.y} L ${p2_b.x},${p2_b.y} L ${p3_b.x},${p3_b.y} Z`;

      // Render group with proper layering: side panels first, then top face with beveled highlights
      hexContent += `
        <g class="hex-column">
          <!-- Left side panel (partially lit) -->
          <path d="${sideLeftPath}" fill="url(#side-left-grad)" stroke="#1a1a20" stroke-width="0.5" />
          <!-- Right side panel (shadowed) -->
          <path d="${sideRightPath}" fill="url(#side-right-grad)" stroke="#141418" stroke-width="0.5" />
          <!-- Top face (matte black with fine bevel border) -->
          <path d="${topPath}" fill="url(#top-grad)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
        </g>
      `;
    });
    hexGroup.innerHTML = hexContent;


    // --- 2. Glowing Winding Ribbon curves ---
    // Generate smooth bezier curve passing horizontally through points
    function generateBezierPath(points, dx = 130) {
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        const cp1x = p0.x + dx;
        const cp1y = p0.y;
        const cp2x = p1.x - dx;
        const cp2y = p1.y;
        d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p1.x} ${p1.y}`;
      }
      return d;
    }

    // Nodes for Ribbon A (Amber-Gold)
    const pointsA = [
      { x: -50, y: 350 },
      { x: 280, y: 560 },
      { x: 620, y: 220 },
      { x: 960, y: 720 },
      { x: 1300, y: 380 },
      { x: 1650, y: 640 },
      { x: 1980, y: 440 }
    ];

    // Nodes for Ribbon B (Cyan)
    const pointsB = [
      { x: -50, y: 650 },
      { x: 280, y: 280 },
      { x: 620, y: 620 },
      { x: 960, y: 300 },
      { x: 1300, y: 660 },
      { x: 1650, y: 360 },
      { x: 1980, y: 560 }
    ];

    // Generate path data strings
    const pathA = generateBezierPath(pointsA);
    const pathB = generateBezierPath(pointsB);

    // Apply paths to Amber Ribbon
    document.getElementById('amber-glow').setAttribute('d', pathA);
    document.getElementById('amber-core').setAttribute('d', pathA);

    // Apply paths to Cyan Ribbon
    document.getElementById('cyan-glow').setAttribute('d', pathB);
    document.getElementById('cyan-core').setAttribute('d', pathB);

    // Apply paths to Violet Ribbon (uses path A geometry, but masked by path B's envelope)
    document.getElementById('violet-glow').setAttribute('d', pathA);
    document.getElementById('violet-core').setAttribute('d', pathA);

    // Update mask components with Cyan ribbon geometry to compute intersection
    document.getElementById('mask-glow-path').setAttribute('d', pathB);
    document.getElementById('mask-core-path').setAttribute('d', pathB);
  </script>
</body>
</html>
